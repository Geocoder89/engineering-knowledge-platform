name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: decision_user
          POSTGRES_PASSWORD: decision_password
          POSTGRES_DB: decision_workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U decision_user -d decision_workflow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://decision_user:decision_password@localhost:5432/decision_workflow
      POSTGRES_USER: decision_user
      POSTGRES_PASSWORD: decision_password
      POSTGRES_DB: decision_workflow
      POSTGRES_PORT: 5432
      DOCUMENT_STORAGE_PATH: var/document-storage
      DOCUMENT_MAX_UPLOAD_SIZE_BYTES: 10485760
      DOCUMENT_PROCESSING_POLL_INTERVAL_SECONDS: 1.0
      OPENAI_API_KEY: ""
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      SESSION_COOKIE_NAME: decision_session
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: lax
      EMAIL_DELIVERY_TIMEOUT_SECONDS: 10.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify migration state
        run: |
          alembic current
          alembic check

      - name: Run tests
        run: python -m pytest -q

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: decision-platform-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure isolated container smoke test
        run: |
          cp .env.example .env
          # No live credentials or external embedding/email requests in this job.
          cat >> .env <<'EOF'

          OPENAI_API_KEY=container-smoke-not-a-real-key
          OPENAI_BASE_URL=http://127.0.0.1:9
          EOF
          docker compose config --quiet

      - name: Build runtime image
        run: docker compose build api

      - name: Apply migrations explicitly
        run: docker compose run --rm migrate

      - name: Start API and worker
        run: docker compose up -d --wait --wait-timeout 90 api worker

      - name: Verify containers and persistent shared storage
        run: bash scripts/smoke_containers.sh

      - name: Show container diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100

      - name: Clean up disposable CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: browser_user
          POSTGRES_PASSWORD: browser_password
          POSTGRES_DB: auth_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U browser_user -d auth_browser_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://browser_user:browser_password@localhost:5432/auth_browser_test
      RUN_BROWSER_AUTH_TESTS: "1"
      API_PROXY_TARGET: http://127.0.0.1:8001
      SESSION_COOKIE_SECURE: "false"
      CSRF_TRUSTED_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173"]'
      OPENAI_API_KEY: ""
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for the live auth fixture
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install API dependencies and migrate the disposable database
        run: |
          python -m pip install -r ../requirements.txt
          cd ..
          python -m alembic upgrade head

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint and check formatting
        run: |
          npm run lint
          npm run format:check

      - name: Build frontend
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 3
