x-application: &application
  build: .
  image: knowledge-decision-platform:local
  env_file:
    - .env
  environment:
    # Container traffic uses the service name and internal port, not localhost.
    DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
    DOCUMENT_STORAGE_PATH: /app/var/document-storage
  init: true
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *application
    profiles: [tools]
    command: ["python", "-m", "alembic", "upgrade", "head"]

  api:
    <<: *application
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - document_storage:/app/var/document-storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).close()"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *application
    command: ["python", "-m", "app.workers.document_processing"]
    volumes:
      - document_storage:/app/var/document-storage
    stop_grace_period: 60s

volumes:
  postgres_data:
  document_storage:
